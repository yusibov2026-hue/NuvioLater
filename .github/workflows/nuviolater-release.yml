name: Build & Release Nuvio Lateral APK (No Liquid Glass)

on:
  push:
    branches: [ "enhanced", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout NuvioLater
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and Publish Nuvio Lateral APK (No Liquid Glass)
        run: |
          python3 scripts/publish_nuviolater.py
          ls -lh release_apks/
